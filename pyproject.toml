[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoredl"
version = "0.1.0"
description = "CLI tool to download and assemble MuseScore sheets into high-quality PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "svglib>=1.5.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0"
]

[project.scripts]
scoredl = "main:main"

[tool.setuptools]
py-modules = ["main", "extractor", "builder"]